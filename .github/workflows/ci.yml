# @file ci.yml
# @brief Reproducible Linux build and protocol validation
# @author modolet <y@xxyx.io>
# @date 2026-10-12
name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - run: nix develop --command cargo fmt --check
      - run: nix develop --command cargo test --locked --all-features -j 2
      - run: nix develop --command cargo clippy --locked --all-targets --all-features -- -D warnings
